name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Repository smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scaffolding
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -d legacy
          test -f legacy/backend/main.py
          test -f backend/pyproject.toml
          echo "Scaffolding intact."

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -v

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Jacer.slnx
      - name: Build
        run: dotnet build Jacer.slnx --configuration Release --no-restore
      # bUnit unit tests only. The Playwright E2E project needs a browser and a
      # running app, so it is built but not executed here — run it locally.
      - name: Test (bUnit)
        run: dotnet test Jacer.Tests/Jacer.Tests.csproj --configuration Release --no-build

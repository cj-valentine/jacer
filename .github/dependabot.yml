version: 2
updates:
  # Python backend (FastAPI + uv, pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # .NET frontend (Blazor solution, NuGet)
  - package-ecosystem: "nuget"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
